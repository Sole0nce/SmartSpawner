# SmartSpawner – formatting.yml
# 插件各处使用的数字格式和生物显示名称。

# ──────────────────────────────────────────────────────
#                  数字格式
# ──────────────────────────────────────────────────────
# 控制大数字在游戏中的显示方式
format_number:
  thousand: "{s}千"    # 示例: 5000 → 5千
  million: "{s}百万"    # 示例: 2000000 → 2百万
  billion: "{s}十亿"    # 示例: 1500000000 → 15亿
  trillion: "{s}万亿"    # 示例: 1000000000000 → 1万亿
  default: "{s}"      # 当没有其他规则匹配时的回退格式

