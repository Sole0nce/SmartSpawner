    - ' &#5DB5F1ℹ 你将获得:'
    - '  &8• &f金钱: &a${total_sell_price}'
    - '  &8• &f经验: &a{current_exp}'
    - ''
    - '&#5DB5F1 ▸ 点击确认！'

# button_sell_info 可用的占位符:
# {entity} - 格式化后的实体或物品名称
# {ᴇɴᴛɪᴛʏ} - 小型大写形式的实体或物品名称
# {current_items} - 已使用的存储格子数
# {max_items} - 最大存储格子数
# {current_exp} - 已存储的经验值
# {total_sell_price} - 总出售价值
# {percent_storage_decimal} - 存储使用率（1 位小数，例如 "87.5"）
# {percent_storage_rounded} - 存储使用率（四舍五入为整数，例如 "88"）
# {loot_items} - 展开为生成好的战利品行
# button_sell_info.loot_items 的占位符: {amount}, {item_name}, {chance}
button_sell_info:
  name: '&f出售 &#5DB5F1汇总'
  lore:
    - ''
    - ' &#5DB5F1ℹ 信息:'
    - '{loot_items}'
    - '  &8• &a+ &f经验: &e{current_exp}'
    - '  &8• &a+ &f金钱: &a${total_sell_price}'
  loot_items: '  &8• &#FF6B6B- &f{item_name}&f: &e{amount}'
  loot_items_empty: '  &8• &#FF6B6B- &f没有可出售的物品'

