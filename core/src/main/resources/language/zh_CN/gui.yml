# SmartSpawner – gui.yml
# 界面物品名称、lore、标题和按钮文案。

# ──────────────────────────────────────────────────────
#                  主界面
# ──────────────────────────────────────────────────────
gui_title_main:
  single_spawner: '{ᴇɴᴛɪᴛʏ} 刷怪笼'
  stacked_spawner: '{amount} 个{ᴇɴᴛɪᴛʏ}刷怪笼'

spawner_storage_item:
  # name 可用的占位符:
  # {max_slots} - 存储最大格子数（千分位格式化）
  # {current_items} - 存储中当前物品数量
  # {percent_storage_rounded} - 存储已用百分比（0-100 取整）
  # {total_sell_price} - 当前刷怪笼中存储物品的总出售价值
  # {entity} - 刷怪笼实体类型（正常首字母大写）
  # {ᴇɴᴛɪᴛʏ} - 刷怪笼实体类型（小型大写字母）
  name: '&f打开 &#5DB5F1存储'

  # 所有 lore 行可用的占位符:
  # {max_slots} - 存储最大格子数（千分位格式化）
  # {current_items} - 存储中当前物品数量
  # {percent_storage_rounded} - 存储已用百分比（0-100 取整）
  # {total_sell_price} - 当前刷怪笼中存储物品的总出售价值
  # {loot_items} - 完整的战利品物品格式化列表
  # {entity} - 刷怪笼实体类型（正常首字母大写）
  # {ᴇɴᴛɪᴛʏ} - 刷怪笼实体类型（小型大写字母）
  lore:
    - ''
    - ' &#5DB5F1ℹ 信息:'
    - '  &8• &f你可以在此查看'
    - '   &f并管理该刷怪笼'
    - '   &f存储的所有物品。'
    - ''
    - ' &#5DB5F1★ 容量: &f{percent_storage_rounded}%'
    - '{loot_items}'
    - ''
    - '&#5DB5F1 ▸ 点击打开存储！'

  # 这定义使用 {loot_items} 时每种战利品物品的显示方式
  # 每种战利品可用的占位符:
  # {item_name} - 物品名称（正常首字母大写）
  # {amount} - 物品数量（千分位格式化）
  # {raw_amount} - 物品数量（无格式化）
  # {chance} - 该物品掉落几率（含 %，例如 "8.5%"）
  loot_items: '  &8• &f{item_name}&f: &e{amount}'
  loot_items_empty: '  &8• &f未存储任何物品'


# 可用的占位符:
# {entity}           - 格式化后的实体名称（例如"僵尸"）
# {ᴇɴᴛɪᴛʏ}           - 小型大写形式的实体名称
# {stack_size}       - 该位置堆叠的刷怪笼数量
# {range}            - 生成范围（格）
# {delay}            - 生成延迟（秒）
# {min_mobs}         - 最少生成生物数量
# {max_mobs}         - 最多生成生物数量
# {current_items}    - 当前存储的物品数量
# {max_items}        - 物品最大存储容量
# {percent_storage_rounded}  - 存储使用率（整数百分比，例如 "87"）
# {percent_storage_decimal} - 存储使用率（带小数的百分比，例如 "87.5"）
# {current_exp}      - 当前存储的经验值（千分位格式化）
# {max_exp}          - 最大经验值容量（千分位格式化）
# {raw_current_exp}  - 原始当前经验值
# {raw_max_exp}      - 原始最大经验值
# {percent_exp_rounded}      - 经验存储使用率（整数百分比）
# {percent_exp_decimal}    - 经验存储使用率（带小数的百分比，例如 "42.7"）
# {time}             - 距下次生成的时间，或在未激活/已满/无战利品时显示的状态文本
# {total_sell_price} - 当前刷怪笼中存储物品的总出售价值
spawner_info_item:
  name: ' &f刷怪笼 &#5DB5F1信息'
  lore:
    - ''
    - ' &#5DB5F1ℹ 状态:'
    - '   &8• &f堆叠: &e{stack_size}'
    - '   &8• &f范围: &e{range} &f格'
    - '   &8• &f生物: &e{min_mobs}&f-&e{max_mobs}'
    - '   &8• &f延迟: &e{delay} &f秒'
    - ''
    - ' &#5DB5F1★ 下次生成: &f{time}'
    - '   &8• &f经验: &e{percent_exp_rounded}%'
    - '   &8• &f存储: &e{percent_storage_rounded}%'
    - '   &8• &f出售价值: &a${total_sell_price}'
    - ''
    - '&#5DB5F1 ▸ 左键点击: &f出售并收集经验'
  lore_no_shop:
    - ''
    - ' &#5DB5F1ℹ 状态:'
    - '   &8• &f堆叠: &e{stack_size}'
    - '   &8• &f范围: &e{range} &f格'
    - '   &8• &f生物: &e{min_mobs}&f-&e{max_mobs}'
    - '   &8• &f延迟: &e{delay} &f秒'
    - ''
    - ' &#5DB5F1★ 下次生成: &f{time}'
    - '   &8• &f经验: &e{percent_exp_rounded}%'
    - '   &8• &f存储: &e{percent_storage_rounded}%'
    - ''
  lore_full: '&#FF4444容量已满'
  lore_inactive: '&#FF4444未激活'
  lore_no_loot: '&#FF4444未配置掉落物'

exp_info_item:
  name: '&f收集 &#5DB5F1经验'
  lore:
    - ''
    - ' &#5DB5F1ℹ 信息:'
    - '  &8• &f收集经验或使用'
    - '   &f经验来修复你的'
    - '   &f经验修补 &f装备。'
    - ''
    - ' &#5DB5F1★ 容量: &f{percent_exp_rounded}%'
    - '  &8• &f已存经验: &a{current_exp}&f/&a{max_exp}'
    - ''
    - '&#5DB5F1 ▸ 点击收集经验！'

